<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><link rel="manifest" href="/manifest.webmanifest"><title>博客后台</title><style>
:root{--bg:#f7f8fb;--text:#18181b;--muted:#71717a;--line:rgba(24,24,27,.08);--accent:#5b5ce2;--glass:rgba(255,255,255,.68);--shadow:0 18px 55px rgba(34,38,72,.1)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;width:280px;height:280px;border-radius:50%;filter:blur(70px);opacity:.25}.body{}body:before{top:-110px;right:-100px;background:#bfc0ff}body:after{top:50%;left:-150px;background:#decaff}.app{width:min(860px,100%);min-height:100vh;margin:auto;background:rgba(255,255,255,.4);border-left:1px solid rgba(255,255,255,.7);border-right:1px solid rgba(255,255,255,.7)}.top{position:sticky;top:10px;z-index:10;width:calc(100% - 20px);margin:10px auto 0;height:60px;padding:0 14px;border:1px solid rgba(255,255,255,.8);border-radius:18px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.67);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 9px 30px rgba(35,40,75,.07);transition:box-shadow .3s}.top h1{font-size:17px;margin:0;letter-spacing:-.02em}.grow{flex:1}.btn{border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:9px 14px;background:linear-gradient(135deg,#5b5ce2,#7778ed);color:#fff;font-weight:750;box-shadow:0 7px 18px rgba(91,92,226,.2);transition:transform .25s,box-shadow .25s,filter .25s}.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(91,92,226,.25);filter:saturate(1.05)}.btn:active{transform:scale(.97)}.btn.light{background:rgba(255,255,255,.72);color:#18181b;border-color:var(--line);box-shadow:none}.content{padding:24px 18px 105px}.screen{display:none;animation:pageIn .42s cubic-bezier(.2,.8,.2,1)}.active{display:block}.title{width:100%;border:0;outline:0;background:transparent;font-size:clamp(30px,7vw,43px);font-weight:850;letter-spacing:-.05em;padding:10px 0}.meta{display:flex;gap:9px}.meta input{width:50%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.62);outline:none;transition:border .2s,box-shadow .2s}.meta input:focus{border-color:rgba(91,92,226,.35);box-shadow:0 0 0 4px rgba(91,92,226,.08)}.editor{width:100%;min-height:58vh;margin-top:15px;border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(255,255,255,.55);outline:none;resize:vertical;font:16px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;box-shadow:inset 0 1px rgba(255,255,255,.9);transition:box-shadow .3s,border .3s}.editor:focus{border-color:rgba(91,92,226,.28);box-shadow:0 0 0 5px rgba(91,92,226,.06)}.item{display:flex;gap:9px;align-items:center;padding:15px;margin:8px 0;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 7px 24px rgba(35,40,75,.04);transition:transform .3s,box-shadow .3s}.item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.item .grow{overflow:hidden;text-overflow:ellipsis}.hint{color:#71717a;font-size:13px}.bar{position:fixed;z-index:12;bottom:10px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 20px));padding:8px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);border-radius:17px;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 12px 40px rgba(35,40,75,.12);display:flex;justify-content:center;gap:8px}.bar button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 13px;color:#52525b;font-weight:650;transition:background .25s,color .25s,transform .25s}.bar button:hover{background:rgba(91,92,226,.08);color:var(--accent);transform:translateY(-1px)}#err{color:#b91c1c}.status{font-size:12px;color:#15803d}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:640px){.top{top:7px;margin-top:7px;width:calc(100% - 14px)}.content{padding:20px 14px 105px}.item{border-radius:14px}.btn{padding:9px 12px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style></head><body><div class="app"><header class="top"><h1 id="head">博客管理</h1><span id="status" class="hint grow"></span><button id="logout" class="btn light" hidden>退出</button><button id="publish" class="btn" hidden>发布</button></header><main class="content"><section id="login" class="screen active"><div style="max-width:430px;margin:10vh auto"><p style="color:#5b5ce2;font-size:12px;font-weight:800;letter-spacing:.18em">PRIVATE BLOG</p><h2 style="font-size:36px;letter-spacing:-.05em;margin:10px 0">欢迎回来</h2><p class="hint">进入你的写作空间。</p><input id="password" type="password" placeholder="管理员密码" style="width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.7);outline:none"><br><br><button id="loginBtn" class="btn" style="width:100%">进入后台</button><p id="err"></p></div></section><section id="list" class="screen"><p class="hint">你的文章</p><h2 style="font-size:32px;letter-spacing:-.04em;margin:4px 0 18px">文章</h2><div id="items"></div></section><section id="edit" class="screen"><input id="title" class="title" placeholder="标题"><div class="meta"><input id="category" placeholder="分类"><input id="slug" placeholder="slug"></div><textarea id="body" class="editor" placeholder="开始写 Markdown……"></textarea><p class="hint">图片不上传到 R2，直接粘贴 Markdown 图片 URL。</p></section></main><div id="bar" class="bar" hidden><button id="new">＋ 新文章</button><button id="home">文章</button></div></div><script src="/admin/app.js"></script></body></html>
